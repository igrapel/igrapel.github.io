<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="../">Ilan Grapel</a>
    <nav class="site-nav" aria-label="Main">
      <a href="../">About</a>
      <a href="../CV/">Resume</a>
      <a href="../writing/">Writing</a>
      <a href="../contact/" aria-current="page">Contact</a>
      <button class="theme-toggle" type="button" id="theme-toggle">Dark</button>
    </nav>
  </div>
</header>
<main class="wrap">
  <section class="prose">
    <h1>Contact</h1>
    <p class="lede">Email is the fastest way to reach me.</p>
  </section>

  <section>
    <dl class="contact-list">
      <dt class="label">Email</dt>
      <dd><a href="mailto:ilan.grapel@gmail.com">ilan.grapel@gmail.com</a></dd>
      <dt class="label">LinkedIn</dt>
      <dd><a href="https://www.linkedin.com/in/ilan-grapel-a2192217/">linkedin.com/in/ilan-grapel-a2192217</a></dd>
    </dl>
  </section>

  <section>
    <h2>Send a message</h2>
    <form action="https://formspree.io/f/xqkbojlk" method="post">
      <input type="hidden" name="_subject" value="Message from igrapel.github.io">
      <div class="form-row">
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" autocomplete="name" required>
      </div>
      <div class="form-row">
        <label for="email">Email address</label>
        <input id="email" name="_replyto" type="email" autocomplete="email" required>
      </div>
      <div class="form-row">
        <label for="topic">Topic</label>
        <select id="topic" name="topic">
          <option>General</option>
          <option>Work opportunity</option>
          <option>Tutoring</option>
          <option>Question</option>
        </select>
      </div>
      <div class="form-row">
        <label for="message">Message</label>
        <textarea id="message" name="Message" required></textarea>
      </div>
      <button type="submit">Send message</button>
      <p class="form-note" id="form-note" role="status"></p>
    </form>
  </section>
</main>
<footer class="site-footer">
  <div class="wrap">

    <nav aria-label="Elsewhere">
